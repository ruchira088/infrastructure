apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-ingress
  namespace: kube-system
spec:
  tls:
    - secretName: headlamp-tls-secret
      hosts:
        - headlamp.home.ruchij.com
  rules:
    - host: headlamp.home.ruchij.com
      http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: headlamp
                port:
                  name: headlamp-port
