---
- hosts: localhost
  connection: local

  vars:
    k8s_config_file: /Users/ruchira/.kube/config

  tasks:
#    - name: Generate Route 53 credentials
#      terraform:
#        project_path: ./route-53-credentials
#        force_init: yes

    - name: Create output directories
      block:
        - file:
            path: output
            state: directory
        - file:
            path: output/cluster-issuer
            state: directory

    - name: Setup Cert Manager in K8s
      block:
        - name: Install Cert Manager
          command: |
              kubectl apply \
                -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.2/cert-manager.yaml \
                --kubeconfig {{ k8s_config_file }}

        - name: Render K8s resource files
          template:
            src: "{{ item }}"
            dest: output/cluster-issuer/{{ item | basename }}
          with_fileglob:
            - k8s-resource-files/cluster-issuer/*.yaml
          vars:
            aws_access_key_id: "{{ lookup('aws_ssm', '/k8s/cert-manager/access-key-id', region='ap-southeast-2') }}"
            aws_secret_access_key: "{{ lookup('aws_ssm', '/k8s/cert-manager/secret-access-key', region='ap-southeast-2') }}"

        - name: Apply K8s resource files
          command: kubectl apply -f output/cluster-issuer --kubeconfig {{ k8s_config_file }}

    - name: Install Headlamp
      block:
        - name: Apply K8s resource files
          command: kubectl apply -f k8s-resource-files/headlamp --kubeconfig {{ k8s_config_file }}

        - name: Read Headlamp admin token
          command: >-
            kubectl -n kube-system get secret headlamp-admin
            -o jsonpath={.data.token}
            --kubeconfig {{ k8s_config_file }}
          register: headlamp_admin_token
          retries: 10
          delay: 3
          until: headlamp_admin_token.stdout | length > 0

        - name: Print Headlamp admin token
          debug:
            msg: "{{ headlamp_admin_token.stdout | b64decode }}"