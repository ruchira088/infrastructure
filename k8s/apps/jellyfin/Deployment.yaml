apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-deployment
  namespace: jellyfin
spec:
  # hostPath config (SQLite library database) must never have two writers
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin-container
          image: jellyfin/jellyfin:12.1
          readinessProbe:
            httpGet:
              port: jellyfin-port
              path: /web
          livenessProbe:
            httpGet:
              port: jellyfin-port
              path: /web
          startupProbe:
            periodSeconds: 15
            initialDelaySeconds: 60
            failureThreshold: 10
            httpGet:
              port: jellyfin-port
              path: /web
          ports:
            - name: jellyfin-port
              containerPort: 8096
          volumeMounts:
            # qBittorrent's download folder (see torrents/). Read-only so Jellyfin
            # can't modify or delete files the torrent client is still seeding.
            - mountPath: /data/torrents
              name: torrents-folder
              readOnly: true
            - mountPath: /config
              name: jellyfin-config
      volumes:
        - name: torrents-folder
          hostPath:
            path: /mnt/storage/torrents
            type: Directory
        - name: jellyfin-config
          hostPath:
            path: /home/ruchira/Data/jellyfin
            type: Directory
