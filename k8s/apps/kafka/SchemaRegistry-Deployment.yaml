apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry-deployment
  namespace: kafka
spec:
  # Old and new pods share SCHEMA_REGISTRY_HOST_NAME and the same leader-election
  # group; during a rolling update the new pod times out joining the group and
  # crash-loops. Stop the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      # Kubernetes injects Docker-style service env vars (e.g. SCHEMA_REGISTRY_PORT
      # from the schema-registry Service), which collides with Confluent's config
      # checks and crashes the container. Disable the injection.
      enableServiceLinks: false
      # After a node reboot this pod can start before the broker, exit 1, and
      # crash-loop. The headless DNS name only resolves once the broker is
      # Ready, so block here until it accepts connections.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - until nc -z -w 2 kafka-broker-0.kafka-headless.kafka.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done
      containers:
        - name: schema-registry-container
          image: confluentinc/cp-schema-registry:8.3.2
          ports:
            - name: schema-port
              containerPort: 8081
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kafka-broker-0.kafka-headless.kafka.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
          # CP 8.x schema-registry can take a while to bind its HTTP listener
          # (Kafka store sync + group join). A startup probe gives it headroom
          # before liveness takes over, so slow starts don't trigger a crash loop.
          startupProbe:
            httpGet:
              port: schema-port
              path: /subjects
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              port: schema-port
              path: /subjects
            periodSeconds: 10
          livenessProbe:
            httpGet:
              port: schema-port
              path: /subjects
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
