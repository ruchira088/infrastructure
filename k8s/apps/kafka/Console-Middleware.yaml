# Delegates auth for the Console to the shared tinyauth gateway in the `auth`
# namespace. Unauthenticated browser requests are redirected to the tinyauth
# login page (auth.home.ruchij.com); on success the request proceeds.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tinyauth-forwardauth
  namespace: kafka
spec:
  forwardAuth:
    address: http://tinyauth.auth.svc.cluster.local:3000/api/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Name
      - Remote-Email
      - Remote-Groups
