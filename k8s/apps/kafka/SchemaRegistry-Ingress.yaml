apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schema-registry-ingress
  namespace: kafka
  annotations:
    # Chain runs in order: authenticate first (tinyauth), then strip the
    # /schema-registry prefix before forwarding to the Schema Registry service.
    traefik.ingress.kubernetes.io/router.middlewares: kafka-tinyauth-forwardauth@kubernetescrd,kafka-schema-registry-stripprefix@kubernetescrd
spec:
  tls:
    - secretName: kafka-console-tls-secret
      hosts:
        - kafka.home.ruchij.com
  rules:
    - host: kafka.home.ruchij.com
      http:
        paths:
          - pathType: Prefix
            path: /schema-registry
            backend:
              service:
                name: schema-registry
                port:
                  name: schema-port
