apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-console-ingress
  namespace: kafka
  annotations:
    # Require login (via the shared tinyauth gateway) for the Console UI.
    traefik.ingress.kubernetes.io/router.middlewares: kafka-tinyauth-forwardauth@kubernetescrd
spec:
  tls:
    - secretName: kafka-console-tls-secret
      hosts:
        - kafka.home.ruchij.com
  rules:
    - host: kafka.home.ruchij.com
      http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: redpanda-console-service
                port:
                  name: console-port
