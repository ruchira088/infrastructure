apiVersion: v1
kind: Service
metadata:
  name: plex-service
  namespace: plex
spec:
  selector:
    app: plex
  # ClusterIP only (used by the Ingress). The pod uses hostNetwork, so LAN
  # clients reach it directly on 192.168.68.64:32400. A NodePort on 32400
  # would make kube-proxy intercept that port.
  ports:
    - name: plex-port
      port: 32400
      targetPort: plex-port
